name: Update Featured Games

on:
  workflow_dispatch:
  schedule:
    - cron: '37 10 * * *'
      timezone: 'Asia/Singapore'
  push:
    branches:
      - main
    paths:
      - '_curated/featured/featured_game_index.json'
      - '_curated/featured/additions.json'
      - 'featured-games-curated.json'
      - '_tools/Prepare-Curated-Sources.py'

concurrency:
  group: update-featured-games
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout curated data
        uses: actions/checkout@v4

      - name: Set up Python for verified curated merge
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore existing release membership and merge new curation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '_curated\_build_inputs' | Out-Null
          gh release download featured-latest --repo $env:GITHUB_REPOSITORY --pattern 'GameBrowser-Featured.zip' --dir '_curated\_build_inputs' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore existing curated release.' }
          gh release download igdb-index-latest --repo $env:GITHUB_REPOSITORY --pattern 'GameBrowser-IGDB-Platform-Index.zip' --dir '_curated\_build_inputs' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify additions against the current IGDB index.' }
          gh release download dat-catalogs-latest --repo $env:GITHUB_REPOSITORY --pattern 'GameBrowser-Data.zip' --dir '_curated\_build_inputs' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check strict DAT-backed membership.' }
          python '_tools/Prepare-Curated-Sources.py' Featured
          if ($LASTEXITCODE -ne 0) { throw 'Curated merge failed; no release will be overwritten.' }

      - name: Validate and package curated Featured Games
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '_tools\Package Curated Game Data.ps1' -Package Featured
          foreach ($path in @('_android\GameBrowser-Featured.zip','_android\GameBrowser-Featured.sha256')) {
            if (!(Test-Path -LiteralPath $path)) { throw "Expected output missing: $path" }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBrowser-Featured
          path: |
            _android/GameBrowser-Featured.zip
            _android/GameBrowser-Featured.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish Featured release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'featured-latest'
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title 'Featured Games Latest' --notes 'Hand-curated Featured Games. GitHub packages and publishes only; it does not select games.'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create featured-latest release.' }
          }
          foreach ($path in @('_android\GameBrowser-Featured.zip','_android\GameBrowser-Featured.sha256')) {
            gh release upload $tag $path --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $path" }
          }
          Write-Host "Published: https://github.com/$repo/releases/download/featured-latest/GameBrowser-Featured.zip"

      - name: Publish dated Featured Games release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $date = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8)).ToString('yyyyMMdd')
          $repo = $env:GITHUB_REPOSITORY
          $tag = "featured-$date"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "Featured Games ($date)" --notes "Daily VideoGamesBrowser data snapshot, Singapore date $date. The permanent *-latest download URLs remain unchanged."
            if ($LASTEXITCODE -ne 0) { throw "Failed to create dated release $tag" }
          }
          $files = @(
            '_android\GameBrowser-Featured.zip',
            '_android\GameBrowser-Featured.sha256'

          )
          foreach ($path in $files) {
            if (!(Test-Path -LiteralPath $path)) { throw "Missing daily release asset: $path" }
            gh release upload $tag $path --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $path to $tag" }
          }
          Write-Host "Published daily snapshot: $tag"
