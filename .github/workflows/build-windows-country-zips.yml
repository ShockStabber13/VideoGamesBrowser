name: Update Windows Indexes

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
      timezone: 'Asia/Singapore'

concurrency:
  group: update-windows-indexes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-country:
    name: Build ${{ matrix.country }} Windows ZIP
    runs-on: windows-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - country: US
          - country: GB
          - country: SG
          - country: CA
          - country: MY

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Write Steam config
        shell: pwsh
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:STEAM_API_KEY)) { throw 'GitHub Secret STEAM_API_KEY is missing.' }
          [ordered]@{
            ApiKey = $env:STEAM_API_KEY
            CountryCode = '${{ matrix.country }}'
          } | ConvertTo-Json -Depth 5 | Set-Content -Path 'steam-config.json' -Encoding UTF8

      - name: Build country ZIP
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '_tools\Build Windows Steam Index One Country.ps1' -Country '${{ matrix.country }}' -ForceRebuild
          if ($LASTEXITCODE -ne 0) { throw "Windows ${{ matrix.country }} build failed with exit code $LASTEXITCODE" }

      - name: Collect country ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'release-assets' | Out-Null
          $zip = '_android\GameBrowser-Windows-${{ matrix.country }}.zip'
          if (!(Test-Path -LiteralPath $zip)) { throw "Expected ZIP missing: $zip" }
          Copy-Item -LiteralPath $zip -Destination 'release-assets\' -Force

      - name: Upload country artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.country }}
          path: release-assets/GameBrowser-Windows-${{ matrix.country }}.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish five Windows indexes
    runs-on: windows-latest
    needs: build-country
    timeout-minutes: 30

    steps:
      - name: Download country artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Verify five requested ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'release-assets' | Out-Null
          Get-ChildItem 'downloaded-artifacts' -Recurse -Filter 'GameBrowser-Windows-*.zip' | ForEach-Object {
            Copy-Item $_.FullName (Join-Path 'release-assets' $_.Name) -Force
          }
          $expected=@('US','GB','SG','CA','MY') | ForEach-Object { "GameBrowser-Windows-$_.zip" }
          foreach ($name in $expected) {
            if (!(Test-Path -LiteralPath (Join-Path 'release-assets' $name))) { throw "Expected release file missing: $name" }
          }
          Get-ChildItem 'release-assets' -File | Format-Table Name,Length -AutoSize

      - name: Publish Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'windows-latest'
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title 'Windows Indexes Latest' --notes 'Five country-specific Windows Steam indexes: US, GB, SG, CA and MY.'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create windows-latest release.' }
          }
          foreach ($code in @('US','GB','SG','CA','MY')) {
            $path="release-assets\GameBrowser-Windows-$code.zip"
            gh release upload $tag $path --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $path" }
          }
