name: Update Daily Chunks

on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'
      timezone: 'Asia/Singapore'
  push:
    branches:
      - main
    paths:
      - '_curated/daily-chunks/daily_chunks.json'
      - '_curated/daily-chunks/daily_chunk_series.json'
      - '_curated/daily-chunks/daily_chunk_index.json'
      - '_curated/daily-chunks/additions.json'
      - 'daily-chunk-game-specific.json'
      - '_tools/Prepare-Curated-Sources.py'

concurrency:
  group: update-daily-chunks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout curated data
        uses: actions/checkout@v4

      - name: Set up Python for verified curated merge
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore existing release membership and merge new curation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '_curated\_build_inputs' | Out-Null
          gh release download dat-catalogs-latest --repo $env:GITHUB_REPOSITORY --pattern 'GameBrowser-DailyChunks.zip' --dir '_curated\_build_inputs' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore existing curated release.' }
          gh release download igdb-index-latest --repo $env:GITHUB_REPOSITORY --pattern 'GameBrowser-IGDB-Platform-Index.zip' --dir '_curated\_build_inputs' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify additions against the current IGDB index.' }
          gh release download dat-catalogs-latest --repo $env:GITHUB_REPOSITORY --pattern 'GameBrowser-Data.zip' --dir '_curated\_build_inputs' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check strict DAT-backed membership.' }
          python '_tools/Prepare-Curated-Sources.py' DailyChunks
          if ($LASTEXITCODE -ne 0) { throw 'Curated merge failed; no release will be overwritten.' }

      - name: Validate and package curated Daily Chunks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '_tools\Package Curated Game Data.ps1' -Package DailyChunks
          foreach ($path in @('_android\GameBrowser-DailyChunks.zip','_android\GameBrowser-DailyChunks.sha256')) {
            if (!(Test-Path -LiteralPath $path)) { throw "Expected output missing: $path" }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBrowser-DailyChunks
          path: |
            _android/GameBrowser-DailyChunks.zip
            _android/GameBrowser-DailyChunks.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish Daily Chunk release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'dat-catalogs-latest'
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title 'DAT Catalogs + Daily Chunks Latest' --notes 'Latest DAT catalog and curated Daily Chunk release assets.'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create dat-catalogs-latest release.' }
          }
          foreach ($path in @('_android\GameBrowser-DailyChunks.zip','_android\GameBrowser-DailyChunks.sha256')) {
            gh release upload $tag $path --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $path" }
          }
          Write-Host "Published: https://github.com/$repo/releases/download/dat-catalogs-latest/GameBrowser-DailyChunks.zip"
