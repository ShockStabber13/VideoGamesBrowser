name: Update Daily Chunks

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'
      timezone: 'Asia/Singapore'

concurrency:
  group: update-daily-chunks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Restore shared builder state
        uses: actions/cache@v4
        with:
          path: |
            DATs
            _cache
            catalog.json
          key: gamebrowser-builder-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gamebrowser-builder-state-${{ runner.os }}-

      - name: Require validated platform catalogs
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath '_cache\platform-catalogs')) {
            throw 'Validated platform catalogs are not cached yet. Run the Update DAT Catalogs workflow once first.'
          }

      - name: Write API configs from GitHub Secrets
        shell: pwsh
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:IGDB_CLIENT_ID)) { throw 'GitHub Secret IGDB_CLIENT_ID is missing.' }
          if ([string]::IsNullOrWhiteSpace($env:IGDB_CLIENT_SECRET)) { throw 'GitHub Secret IGDB_CLIENT_SECRET is missing.' }
          if ([string]::IsNullOrWhiteSpace($env:STEAM_API_KEY)) { throw 'GitHub Secret STEAM_API_KEY is missing.' }
          [ordered]@{ ClientId=$env:IGDB_CLIENT_ID; ClientSecret=$env:IGDB_CLIENT_SECRET } | ConvertTo-Json | Set-Content 'igdb-config.json' -Encoding UTF8
          [ordered]@{ ApiKey=$env:STEAM_API_KEY; CountryCode='SG' } | ConvertTo-Json | Set-Content 'steam-config.json' -Encoding UTF8

      - name: Build quality-only Daily Chunks
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '_tools\Build Daily Chunks.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Daily Chunk build failed with exit code $LASTEXITCODE" }

      - name: Verify Daily Chunk package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('_android\GameBrowser-DailyChunks.zip','_android\GameBrowser-DailyChunks.sha256','_android\daily_chunk_index.json')) {
            if (!(Test-Path -LiteralPath $path)) { throw "Expected output missing: $path" }
          }
          $daily = @((Get-Content '_android\daily_chunk_index.json' -Raw -Encoding UTF8 | ConvertFrom-Json) | ForEach-Object { $_ })
          $bad = @($daily | Where-Object { $_.chunkSource -ne 'game-specific' -and $_.chunkSource -ne 'franchise' })
          if ($bad.Count -gt 0) { throw "Generic/non-curated Daily Chunk rules detected: $($bad.Count)" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path '_android\GameBrowser-DailyChunks.zip'))
          try {
            $names=@($zip.Entries | ForEach-Object { $_.FullName })
            if ('featured_game_index.json' -in $names) { throw 'Daily Chunk ZIP incorrectly contains Featured data.' }
          } finally { $zip.Dispose() }
          Write-Host "Verified $($daily.Count) quality-only Daily Chunk entries."

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBrowser-DailyChunks
          path: |
            _android/GameBrowser-DailyChunks.zip
            _android/GameBrowser-DailyChunks.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish Daily Chunk release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'dat-catalogs-latest'
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title 'DAT Catalogs + Daily Chunks Latest' --notes 'Independent latest DAT catalog and Daily Chunk release assets.'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create dat-catalogs-latest release.' }
          }
          foreach ($path in @('_android\GameBrowser-DailyChunks.zip','_android\GameBrowser-DailyChunks.sha256')) {
            gh release upload $tag $path --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $path" }
          }
          Write-Host 'Published: https://github.com/'$repo'/releases/download/dat-catalogs-latest/GameBrowser-DailyChunks.zip'
