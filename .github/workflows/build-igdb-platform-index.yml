name: Update IGDB Platform Index

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'
      timezone: 'Asia/Singapore'
    - cron: '37 6 * * *'
      timezone: 'Asia/Singapore'
    - cron: '37 8 * * *'
      timezone: 'Asia/Singapore'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-igdb-platform-index.yml'

concurrency:
  group: update-igdb-platform-index
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '37 8 * * *')
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Build compact IGDB game/platform index
        shell: pwsh
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:IGDB_CLIENT_ID)) { throw 'GitHub Secret IGDB_CLIENT_ID is missing.' }
          if ([string]::IsNullOrWhiteSpace($env:IGDB_CLIENT_SECRET)) { throw 'GitHub Secret IGDB_CLIENT_SECRET is missing.' }

          # This is a PowerShell script, not an external executable. If it throws,
          # ErrorActionPreference=Stop fails the step. Do not use $LASTEXITCODE here;
          # it can be blank after a successful .ps1 invocation.
          & '_tools\Build IGDB Platform Index.ps1' -OutputDirectory '_android\igdb-platform-index'

          foreach ($path in @('_android\GameBrowser-IGDB-Platform-Index.zip','_android\GameBrowser-IGDB-Platform-Index.zip.sha256')) {
            if (!(Test-Path -LiteralPath $path)) { throw "Expected output missing: $path" }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBrowser-IGDB-Platform-Index
          path: |
            _android/GameBrowser-IGDB-Platform-Index.zip
            _android/GameBrowser-IGDB-Platform-Index.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish IGDB index release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'igdb-index-latest'
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title 'IGDB Platform Index Latest' --notes 'Compact IGDB game ID, title, platform and release-date index for VideoGamesBrowser tooling.'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create igdb-index-latest release.' }
          }
          foreach ($path in @('_android\GameBrowser-IGDB-Platform-Index.zip','_android\GameBrowser-IGDB-Platform-Index.zip.sha256')) {
            gh release upload $tag $path --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $path" }
          }
          Write-Host "Published: https://github.com/$repo/releases/download/igdb-index-latest/GameBrowser-IGDB-Platform-Index.zip"

      - name: Publish dated IGDB Platform Index release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $date = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8)).ToString('yyyyMMdd')
          $repo = $env:GITHUB_REPOSITORY
          $tag = "igdb-index-$date"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "IGDB Platform Index ($date)" --notes "Daily VideoGamesBrowser data snapshot, Singapore date $date. The permanent *-latest download URLs remain unchanged."
            if ($LASTEXITCODE -ne 0) { throw "Failed to create dated release $tag" }
          }
          $files = @(
            '_android\GameBrowser-IGDB-Platform-Index.zip',
            '_android\GameBrowser-IGDB-Platform-Index.zip.sha256'

          )
          foreach ($path in $files) {
            if (!(Test-Path -LiteralPath $path)) { throw "Missing daily release asset: $path" }
            gh release upload $tag $path --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $path to $tag" }
          }
          Write-Host "Published daily snapshot: $tag"

      - name: Prevent the 60-day public-repository schedule shutdown
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch main to inspect repository activity.' }
          git checkout -B main origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check out main for keepalive.' }
          $lastCommit = [long]((git log -1 --format=%ct).Trim())
          $daysOld = ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $lastCommit) / 86400
          if ($daysOld -ge 40) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'chore: keep scheduled data publishing active'
            if ($LASTEXITCODE -ne 0) { throw 'Keepalive commit failed.' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Keepalive push failed.' }
            Write-Host 'Created a keepalive commit to prevent GitHub schedule deactivation.'
          } else {
            Write-Host "Latest commit is $([math]::Round($daysOld, 1)) days old; no keepalive needed."
          }

dispatch-data-builds:
    name: Activate and dispatch DAT / Windows publishing
    if: github.event_name == 'push' || (github.event_name == 'schedule' && (github.event.schedule == '37 4 * * *' || github.event.schedule == '37 6 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch the workflow due at the Singapore time slot
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_EVENT: ${{ github.event_name }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          targets=()
          if [[ "$TRIGGER_EVENT" == "push" ]]; then
            # Bootstrap check: enables workflows disabled during inactivity and runs each once.
            targets=(build-dat-catalogs.yml build-windows-country-zips.yml)
          elif [[ "$CRON_EXPRESSION" == "37 4 * * *" ]]; then
            targets=(build-dat-catalogs.yml)
          elif [[ "$CRON_EXPRESSION" == "37 6 * * *" ]]; then
            targets=(build-windows-country-zips.yml)
          else
            echo "No scheduled data workflow is due."
            exit 0
          fi
          for workflow in "${targets[@]}"; do
            echo "Enabling $workflow if needed..."
            gh workflow enable "$workflow" --repo "$GITHUB_REPOSITORY"
            echo "Dispatching $workflow..."
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            echo "Successfully dispatched $workflow"
          done

