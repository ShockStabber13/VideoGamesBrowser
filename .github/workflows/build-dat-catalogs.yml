name: Update DAT Catalogs

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'
      timezone: 'Asia/Singapore'

concurrency:
  group: update-dat-catalogs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Restore shared builder state
        uses: actions/cache@v4
        with:
          path: |
            DATs
            _cache
            catalog.json
          key: gamebrowser-builder-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gamebrowser-builder-state-${{ runner.os }}-

      - name: Write IGDB config from GitHub Secrets
        shell: pwsh
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:IGDB_CLIENT_ID)) { throw 'GitHub Secret IGDB_CLIENT_ID is missing.' }
          if ([string]::IsNullOrWhiteSpace($env:IGDB_CLIENT_SECRET)) { throw 'GitHub Secret IGDB_CLIENT_SECRET is missing.' }
          [ordered]@{
            ClientId = $env:IGDB_CLIENT_ID
            ClientSecret = $env:IGDB_CLIENT_SECRET
          } | ConvertTo-Json | Set-Content -Path 'igdb-config.json' -Encoding UTF8

      - name: Update preservation DATs
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '_tools\Local Web Server.ps1' -ForceDatRefresh
          if ($LASTEXITCODE -ne 0) { throw "DAT update failed with exit code $LASTEXITCODE" }

      - name: Compare with IGDB and rebuild DAT-backed catalogs
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '_tools\Local Web Server.ps1' -BuildStaticCache
          if ($LASTEXITCODE -ne 0) { throw "Catalog build failed with exit code $LASTEXITCODE" }

      - name: Package GameBrowser-Data.zip
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '_tools\Build Android Database.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Database package failed with exit code $LASTEXITCODE" }
          foreach ($path in @('_android\GameBrowser-Data.zip','_android\GameBrowser-Data.sha256')) {
            if (!(Test-Path -LiteralPath $path)) { throw "Expected output missing: $path" }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBrowser-Data
          path: |
            _android/GameBrowser-Data.zip
            _android/GameBrowser-Data.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish DAT catalog release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'dat-catalogs-latest'
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title 'DAT Catalogs + Daily Chunks Latest' --notes 'Independent latest DAT catalog and Daily Chunk release assets.'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create dat-catalogs-latest release.' }
          }
          foreach ($path in @('_android\GameBrowser-Data.zip','_android\GameBrowser-Data.sha256')) {
            gh release upload $tag $path --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $path" }
          }
          Write-Host 'Published: https://github.com/'$repo'/releases/download/dat-catalogs-latest/GameBrowser-Data.zip'
